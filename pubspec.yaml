name: stour
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_neumorphic_plus: 3.4.0
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.2
  multi_select_flutter: ^4.1.3
  cloud_firestore: ^5.6.11
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  collection: ^1.17.1
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  curved_navigation_bar: ^1.0.3
  permission_handler: ^12.0.1
  path_provider: ^2.0.15
  google_maps_flutter: ^2.2.8
  google_maps_flutter_web: ^0.5.12+2
  geolocator: ^14.0.2
  simple_animations: ^5.2.0
  geocoding: ^4.0.0
  timeline_tile: ^2.0.0
  flutter_rounded_date_picker: ^3.0.3
  firebase_storage: ^12.4.9
  url_launcher: ^6.1.7
  drag_and_drop_lists: ^0.4.2
  uuid: ^4.5.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  cloudinary_public: ^0.23.1
  http: ^1.2.1
  http_parser: ^4.0.0
  share_plus: ^11.0.0
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^19.2.1
  flutter_dotenv: ^6.0.0
  speech_to_text: ^7.3.0
  flutter_markdown: ^0.7.7
  flutter_ringtone_player: ^4.0.0
  flutter_webrtc: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_generative_ai: ^0.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/BaoTangMyThuat/Bao-tang-My-thuat-TP-HCM-ivivu.jpg
    - assets/splash_screen.png
    - assets/logo.png
    - assets/default_avatar.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: lib/assets/fonts/Montserrat-Regular.otf
        - asset: lib/assets/fonts/Montserrat-Medium.otf
          weight: 500
        - asset: lib/assets/fonts/Montserrat-Bold.otf
          weight: 700
        - asset: lib/assets/fonts/Montserrat-SemiBold.otf
          weight: 600
